# Sources de données provisionnées automatiquement au démarrage de
# Grafana — rien à cliquer dans l'interface, tout est versionné ici.

apiVersion: 1

datasources:
  # Métriques Flink (job en cours, débit, mémoire JVM).
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # KPI et fraîcheur des données — requêtes SQL directes sur la même
  # base que celle utilisée pour les contrôles manuels
  # (docs/guides/consulter_les_donnees.md). C'est la source de la
  # métrique la plus importante du mémoire : le délai entre une
  # écriture source et sa disponibilité en KPI.
  - name: PostgreSQL analytique
    uid: postgres-analytics
    type: postgres
    access: proxy
    url: postgres-analytics:5432
    database: dprest_analytics
    # Étape 7 : compte dédié en LECTURE SEULE (créé le 2026-09-12,
    # voir docs/decisions.md), plus le compte propriétaire `dprest`
    # utilisé par Flink pour écrire. Grafana n'a besoin que de lire.
    user: dprest_lecture
    secureJsonData:
      # Syntaxe $__env{...} : substitution documentée par Grafana
      # (depuis la 8.x), fiable ici — vérifiée après coup en interrogeant
      # le panneau de fraîcheur des KPI. La valeur vient de docker-compose.yml.
      password: $__env{ANALYTICS_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  # Base SOURCE (simulateur_V5) — accès direct, en lecture, uniquement
  # pour surveiller le retard des slots de réplication logique
  # (pg_replication_slots). Ce n'est PAS une entorse au principe « la
  # source n'est jamais interrogée par les outils de restitution » : ici
  # on lit une vue système de supervision, jamais les données métier.
  - name: PostgreSQL source (simulateur_V5)
    uid: postgres-source
    type: postgres
    access: proxy
    url: postgres:5432
    database: echo_db
    # Étape 7 : compte de supervision dédié (rôle intégré `pg_monitor`,
    # créé le 2026-09-12, voir docs/decisions.md) — plus le compte
    # applicatif `echo`. Testé : peut lire pg_replication_slots, ne peut
    # pas lire TB_FACTURES ni aucune autre table métier.
    user: monitoring_ro
    secureJsonData:
      password: $__env{SOURCE_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  # Activité Superset (audit) — étape 7 : la traçabilité déjà native de
  # Superset (table `logs`), rendue visible sans nouvel outil.
  - name: PostgreSQL Superset (audit)
    uid: superset-db
    type: postgres
    access: proxy
    url: superset-db:5432
    database: superset
    user: superset_ro
    secureJsonData:
      password: $__env{SUPERSET_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  # État des connecteurs Debezium — Kafka Connect n'expose aucune
  # métrique Prometheus native sur cette image ; son API REST donne
  # directement l'état RUNNING/FAILED du connecteur et de sa tâche.
  # Plugin communautaire installé via GF_INSTALL_PLUGINS (docker-compose.yml).
  - name: Kafka Connect (JSON API)
    uid: kafka-connect-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    jsonData:
      # Restreint les requêtes de ce datasource à cette seule cible —
      # évite qu'un tableau de bord interroge une URL arbitraire.
      allowedHosts:
        - http://kafka-connect:8083
    editable: false
