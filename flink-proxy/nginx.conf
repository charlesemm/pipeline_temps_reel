# Étape 7f (2026-09-29) : page de connexion devant le Flink Dashboard.
#
# Flink n'a pas d'authentification native sur son interface web : sans ce
# proxy, quiconque atteint le port 8082 voit les jobs et peut les annuler
# (bouton "Cancel Job"). Le JobManager n'est plus publié directement (voir
# docker-compose.yml) ; seul ce proxy l'est, protégé par mot de passe.
# Le fichier .htpasswd est généré au démarrage du conteneur à partir des
# variables FLINK_ADMIN_USER / FLINK_ADMIN_PASSWORD_APR1 (.env) — jamais
# écrit ni versionné ici.

events {}

http {
  server {
    listen 8081;

    auth_basic "Flink Dashboard (SGD)";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
      proxy_pass http://flink-jobmanager:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 90s;
    }
  }
}
