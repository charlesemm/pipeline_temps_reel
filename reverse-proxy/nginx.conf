# Reverse proxy HTTPS — étape 7 (chiffrement des échanges).
#
# Périmètre volontairement limité aux deux interfaces web qu'un vrai
# utilisateur ouvrirait dans un navigateur (Grafana, Superset). Le reste
# du pipeline (Kafka, Flink, PostgreSQL, Kafka Connect) communique en
# clair sur le réseau Podman interne, qui ne sort jamais de cette
# machine — limite assumée et documentée dans docs/decisions.md, avec
# ce qu'il faudrait ajouter pour une vraie mise en production distribuée
# sur plusieurs machines (TLS inter-services, mTLS).
#
# Un seul conteneur nginx (léger, quelques Mo de RAM) plutôt que
# configurer TLS séparément dans chaque application.

worker_processes 1;

events {
    worker_connections 256;
}

http {
    # Résolveur DNS interne — PAS 127.0.0.11 (convention Docker,
    # inopérante sous Podman : "aardvark-dns" répond sur une IP propre
    # à chaque réseau, ex. 10.89.2.1, injectée au démarrage par
    # docker-compose.yml (voir son "command:"). Combiné à un proxy_pass
    # utilisant une variable, force nginx à réévaluer le nom de service
    # à chaque requête plutôt que de figer son IP une fois pour toutes
    # au démarrage. Sans ça, recréer Grafana ou Superset laisse le
    # proxy en 502 Bad Gateway jusqu'à son propre redémarrage —
    # constaté le 2026-09-12.
    resolver __RESOLVER__ valid=10s;

    # Grafana en HTTPS sur 3443 (au lieu de 3000 en clair, resté ouvert
    # en interne pour ne rien casser — voir docker-compose.yml).
    server {
        listen 3443 ssl;
        server_name pipeline-dprest.local;

        ssl_certificate     /etc/nginx/certs/pipeline.crt;
        ssl_certificate_key /etc/nginx/certs/pipeline.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            set $grafana_upstream http://grafana:3000;
            proxy_pass $grafana_upstream;
            # $http_host (pas $host) : garde le port du navigateur (ex. :3443).
            # $host le tronque, ce qui a causé un rejet CSRF côté Superset
            # ("The referrer does not match the host") — voir docs/decisions.md.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Grafana Live (WebSocket) : nécessaire pour les mises à jour
            # en direct des tableaux de bord.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Superset en HTTPS sur 8443 (au lieu de 8088 en clair).
    server {
        listen 8443 ssl;
        server_name pipeline-dprest.local;

        ssl_certificate     /etc/nginx/certs/pipeline.crt;
        ssl_certificate_key /etc/nginx/certs/pipeline.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Fichiers statiques (logo CNAM des dashboards) — évite les images
        # en "data:" URI dans les blocs markdown Superset, bloquées par
        # l'assainisseur DOMPurify côté navigateur.
        location /assets/ {
            alias /etc/nginx/assets/;
        }

        location / {
            set $superset_upstream http://superset:8088;
            proxy_pass $superset_upstream;
            # $http_host (pas $host) : garde le port du navigateur (:8443).
            # Avec $host (sans port), Superset voyait Host=172.31.104.114 et
            # reconstruisait son URL interne avec le port réel (8088), ce qui
            # ne correspondait plus au Referer du navigateur (:8443) — la
            # protection CSRF de Superset rejetait alors toute création
            # (base de données, jeu de données...) avec "400 Bad Request:
            # The referrer does not match the host." Constaté le 2026-09-14,
            # voir docs/decisions.md.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
